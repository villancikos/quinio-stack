services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    volumes:
      - ${DOCKER_DATA_DIR}/gluetun:/gluetun
    expose:
      - 9191
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dispatcharr.rule=Host(`${DISPATCHARR_HOSTNAME}`)"
      - "traefik.http.routers.dispatcharr.entrypoints=websecure"
      - "traefik.http.routers.dispatcharr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dispatcharr.middlewares=authelia@docker"
      - "traefik.http.routers.dispatcharr-xc.rule=Host(`${DISPATCHARR_HOSTNAME}`) && (Path(`/player_api.php`) || Path(`/get.php`) || Path(`/xmltv.php`) || PathPrefix(`/live/`) || PathPrefix(`/movie/`) || PathPrefix(`/series/`) || PathPrefix(`/timeshift/`) || PathPrefix(`/proxy/`))"
      - "traefik.http.routers.dispatcharr-xc.entrypoints=websecure"
      - "traefik.http.routers.dispatcharr-xc.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dispatcharr-xc.service=dispatcharr"
      - "traefik.http.routers.dispatcharr-xc.priority=100"
      - "traefik.http.services.dispatcharr.loadbalancer.server.port=9191"
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 1m
    profiles:
      - gluetun
      - all

  gost:
    image: ginuerzh/gost
    container_name: gost
    restart: unless-stopped
    network_mode: service:gluetun
    command: "-L :8080"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    profiles:
      - gluetun
      - all
